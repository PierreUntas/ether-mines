# Tests à chaque push et pull request : syntaxe, générateur et règles, puis schéma SQL et scénarios de triche.
name: Tests
on:
  push:
  pull_request:
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe
        run: for f in src/*.js src/jeu/*.js supabase/functions/_shared/*.js tools/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Générateur et règles
        run: node --test tests/*.test.mjs
      - name: Mise en forme (Prettier)
        run: npx --yes prettier@3 --check "src/jeu/*.js" "src/*.js" "supabase/functions/_shared/*.js"
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schéma, règles et scénarios de jeu et de triche
        run: tests/sql/run.sh
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navigateur et three.js
        run: npm i --no-save playwright@1.56.0 three@0.128.0 && npx playwright install --with-deps chromium
      - name: Partie en mode solo dans Chromium
        run: node tests/navigateur.mjs
