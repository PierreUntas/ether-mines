# Tests on every push and pull request: syntax, generator and rules, SQL schema and cheating scenarios,
# browser, and the contracts (Seal, Network).
name: Tests
on:
  push:
  pull_request:
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in src/*.js src/game/*.js supabase/functions/_shared/*.js tools/*.mjs tests/*.mjs; do node --check "$f"; done
      - name: Generator and rules
        run: node --test tests/*.test.mjs
      - name: Formatting (Prettier)
        run: npx --yes prettier@3 --check "src/game/*.js" "src/*.js" "supabase/functions/_shared/*.js"
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schema, rules, and game and cheating scenarios
        run: tests/sql/run.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser and three.js
        run: npm i --no-save playwright@1.56.0 three@0.128.0 && npx playwright install --with-deps chromium
      - name: Solo-mode playthrough in Chromium
        run: node tests/navigateur.mjs
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Dependencies (forge-std, OpenZeppelin — not checked in, see contracts/remappings.txt)
        run: |
          cd contracts
          forge install foundry-rs/forge-std --no-git --no-commit
          forge install OpenZeppelin/openzeppelin-contracts --no-git --no-commit
      - name: Formatting (forge fmt)
        run: cd contracts && forge fmt --check
      - name: Foundry tests, including fuzzing (Seal, Network)
        run: cd contracts && forge test -vv
