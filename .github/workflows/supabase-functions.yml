# Déploie les fonctions Supabase à chaque changement poussé sur main.
# Secrets du dépôt à créer une fois (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN : jeton personnel (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF  : identifiant du projet (euytymfcncakzqzdynbq)
name: Fonctions Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy figer --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
