# Deploys the Supabase functions on every push to main that touches them.
# Repo secrets to create once (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN: personal token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF:  project id (euytymfcncakzqzdynbq)
name: Supabase Functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/supabase-functions.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Supabase CLI installed via npm (setup-cli@v1 "latest" stopped installing on October 1, 2026)
      - run: npx --yes supabase@2 functions deploy freeze link-wallet chain --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
