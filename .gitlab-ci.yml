# GitLab CI: the same checks as .github/workflows (kept in case the GitHub repo comes back).
# Tests on every push and merge request; the "freeze" Supabase function is deployed from main when it
# changes, and only once the tests have passed.
# CI/CD variables to create once (Settings → CI/CD → Variables, "Masked" and "Protected" checked):
#   SUPABASE_ACCESS_TOKEN: personal token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF:  project id (euytymfcncakzqzdynbq)
#   FLY_API_TOKEN:         deploy token for the game server (fly tokens create deploy -a ethermines-game)
stages: [test, deploy]

# Saving compute minutes (the free plan's ran out in October 2026): a newer push cancels the pipeline it
# replaces, the tests only run when something they check changed (not for docs or Unity scenes alone), npm's
# downloads are cached, and the slow browser test only runs when started by hand (or in a merge request).
default:
  interruptible: true

.code-changed: &code-changed
  changes:
    - src/**/*
    - supabase/**/*
    - server/**/*
    - tests/**/*
    - tools/**/*
    - "*.html"
    - unity/Assets/Resources/**/*
    - unity/tools/**/*
    - .gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

js:
  stage: test
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH
      <<: *code-changed
  cache:
    key:
      files: [server/package-lock.json]
    paths: [server/node_modules/, .npm/]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  script:
    - for f in src/*.js src/game/*.js supabase/functions/_shared/*.js tools/*.mjs tests/*.mjs server/src/*.js; do node --check "$f"; done
    - npm ci --prefix server
    - node --test tests/*.test.mjs
    - npx --yes prettier@3 --check "src/game/*.js" "src/*.js" "supabase/functions/_shared/*.js"

sql:
  stage: test
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH
      changes:
        - supabase/**/*
        - tests/sql/**/*
        - tests/fixtures.mjs
        - tools/rules.mjs
        - tools/installation.mjs
        - .gitlab-ci.yml
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    PGHOST: postgres
    PGUSER: postgres
    PGPASSWORD: postgres
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client > /dev/null
    - until pg_isready -q; do sleep 1; done
  script:
    - tests/sql/run.sh

browser:
  stage: test
  # Chromium and its system libraries already installed, for the same Playwright version as the tests
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  # GitLab's small shared machines render WebGL very slowly: a failure here shows in orange without
  # blocking the pipeline (the same test runs before every delivery on a faster machine)
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *code-changed
    - when: manual
  script:
    - npm i --no-save playwright@1.56.0 three@0.128.0
    - node tests/navigateur.mjs

freeze:
  stage: deploy
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - supabase/functions/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
  script:
    - npx --yes supabase@2 functions deploy freeze --project-ref "$SUPABASE_PROJECT_REF" --use-api
    # the premium payments (050_purchases.sql); the webhook checks Stripe's signature, not a player token
    - npx --yes supabase@2 functions deploy checkout --project-ref "$SUPABASE_PROJECT_REF" --use-api
    - npx --yes supabase@2 functions deploy stripe-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --use-api
    - npx --yes supabase@2 functions deploy iap-verify --project-ref "$SUPABASE_PROJECT_REF" --use-api
    - npx --yes supabase@2 functions deploy iap-notify --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --use-api

# the game server (server/), on Fly.io: deployed from main when it changes, once the tests have passed
game-server:
  stage: deploy
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $FLY_API_TOKEN
      changes:
        - server/**/*
        - .gitlab-ci.yml
        # the game's scripts the server runs too (server/src/shared.js)
        - supabase/functions/_shared/world.js
        - supabase/functions/_shared/rules.js
        - src/mesh.js
        - src/mobs-core.js
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web" && $FLY_API_TOKEN
  script:
    - curl -fsSL https://fly.io/install.sh | sh
    - mkdir -p server/shared && cp supabase/functions/_shared/world.js supabase/functions/_shared/rules.js src/mesh.js src/mobs-core.js server/shared/
    - cd server && ~/.fly/bin/flyctl deploy --remote-only
